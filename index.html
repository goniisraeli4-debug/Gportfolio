    <!-- GitHub Pages custom domains never send HSTS. Safari can stay on http://
         and then warn once you start interacting (scroll). Force https on the live domain. -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <script>
      if (location.protocol === "http:" && /(?:^|\.)goniis\.com$/.test(location.hostname)) {
        location.replace("https://" + location.host + location.pathname + location.search + location.hash);
      }
    </script>
